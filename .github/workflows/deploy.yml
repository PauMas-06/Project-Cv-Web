name: Deploy to AWS
on:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: por defecto solo lectura; el permiso para pedir credenciales a AWS va solo en "deploy".
permissions:
  contents: read

# Si llegan dos pushes seguidos, el segundo espera a que acabe el primero (nunca dos despliegues a la vez).
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # _astro/ lleva un hash en el nombre: si cambia el contenido, cambia el nombre -> se puede cachear un año.
      # El resto (HTML, PDFs del CV, favicon...) mantiene el nombre, así que el navegador debe revalidar.
      - name: Sync to S3
        run: |
          aws s3 sync dist/_astro s3://${{ vars.S3_BUCKET }}/_astro --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} --delete --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} --paths "/*"
